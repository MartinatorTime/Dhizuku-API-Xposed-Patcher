name: Download and Patch Apps

on:
  workflow_call:
    inputs:
      patch_Droid-ify:
        description: 'Patch Droid-ify'
        default: true
        required: true
        type: boolean
      patch_Neo-Store:
        description: 'Patch Neo Store'
        default: true
        required: true
        type: boolean
  workflow_dispatch:
    inputs:
      patch_Droid-ify:
        description: 'Patch Droid-ify'
        default: true
        required: true
        type: boolean
      patch_Neo-Store:
        description: 'Patch Neo Store'
        default: true
        required: true
        type: boolean

jobs:
  Clean:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Delete all releases
        run: |
          gh release list --limit 1000 | awk '{print $1}' | while read tag; do
            echo "Deleting release: $tag"
            gh release delete "$tag" -y || true
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete all tags
        run: |
          git fetch --tags
          git ls-remote --tags origin | awk '{print $2}' | sed 's|refs/tags/||' | while read tag; do
            echo "Deleting tag: $tag"
            git push origin --delete "$tag" || true
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete workflow runs
        uses: Mattraks/delete-workflow-runs@v2.1.0
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 0
          keep_minimum_runs: 0

  build-clients:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@master
        with:
          ref: main

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'adopt'
          java-version: '24'

      - name: Download LSPatch Jar from Github
        uses: robinraju/release-downloader@v1
        with:
          fileName: "lspatch.jar"
          repository: JingMatrix/LSPatch
          latest: true

      - name: Rename LSPatch Jar from Github
        run: mv lspatch.jar patcher.jar
        shell: bash

      - name: Download Uber-apk-signer Jar from Github
        uses: robinraju/release-downloader@v1
        with:
          fileName: "uber-apk-signer-1.3.0.jar"
          repository: patrickfav/uber-apk-signer
          latest: true

      - name: Download Dhizuku-API-Xposed Module
        uses: robinraju/release-downloader@v1
        with:
          fileName: "DAX*.apk"
          repository: iamr0s/Dhizuku-API-Xposed
          latest: true

      - name: Download Droid-ify
        if: ${{ github.event.inputs.patch_Droid-ify == 'true' }}
        uses: robinraju/release-downloader@v1
        with:
          fileName: "app-release.apk"
          repository: Droid-ify/client
          latest: true

      - name: Rename Droid-ify
        if: ${{ github.event.inputs.patch_Droid-ify == 'true' }}
        run: mv app-release.apk Droid-ify.apk
        shell: bash

      - name: Download Neo Store
        if: ${{ github.event.inputs.patch_Neo-Store == 'true' }}
        uses: robinraju/release-downloader@v1
        with:
          fileName: "Neo_Store_*_release.apk"
          repository: NeoApplications/Neo-Store
          latest: true


      - name: Patch and Sign Clients
        run: |
          patch_and_sign() {
            local pattern=$1
            local output_name=$2
            
            # Find the input file
            local input_apk=$(ls $pattern 2>/dev/null | head -n 1)
            if [ -z "$input_apk" ]; then
              echo "Error: No file found for $pattern! Skipping..."
              return
            fi
            
            # 1. Patch
            java -jar patcher.jar -f -l 0 "$input_apk" $(cat module_list.txt)
            
            local patched_apk=$(ls *-lspatched.apk 2>/dev/null | head -n 1)
            
            if [ -f "$patched_apk" ]; then
                echo "Signing: $patched_apk"
                
                #java -jar uber-apk-signer-1.3.0.jar -a "$patched_apk" --allowResign
                java -jar uber-apk-signer-1.3.0.jar -a "$patched_apk" --allowResign --skipZipAlign
                
                local base_name="${patched_apk%.*}"
                mv "${base_name}-debugSigned.apk" "$output_name"
                
                # 5. Cleanup inputs and the temp patched file
                rm "$input_apk" "$patched_apk"
            else
                echo "Error: Patching failed for $input_apk"
            fi
          }

          # Process each client
          patch_and_sign "Neo_Store_*" "Neo-Store-patched.apk"
          patch_and_sign "Droid-ify.apk" "Droid-ify-patched.apk"
        shell: bash

      - name: Setup Android Build Tools
        run: |
          mkdir -p $HOME/android-tools
          curl -sSL https://dl.google.com/android/repository/build-tools_r33.0.2-linux.zip -o build-tools.zip
          unzip -q build-tools.zip -d $HOME/android-tools


      - name: Create Release Info
        run: |
          AAPT=$HOME/android-tools/android-13/aapt
          chmod +x "$AAPT"

          # Function to get info and rename
          process_apk() {
            local file=$1
            local name=$2
            INFO=$("$AAPT" dump badging "$file" | grep versionName)
            VN=$(echo "$INFO" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")
            VC=$(echo "$INFO" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p")
            echo "- $name - $VN ($VC)" >> release_body.txt
            mv "$file" "${name}-${VN}.apk"
          }

          echo "Clients:" >> release_body.txt
          process_apk "Droid-ify-patched.apk" "Droid-ify"
          process_apk "Neo-Store-patched.apk" "Neo-Store"
        shell: bash

      - name: Upload Release
        id: upload_release
        uses: softprops/action-gh-release@master
        with:
          files: |
            *patched.apk
          tag_name: Dhizuku-API-patched
          draft: false
          body_path: release_body.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
